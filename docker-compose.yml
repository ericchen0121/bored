services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bored
      POSTGRES_PASSWORD: bored
      POSTGRES_DB: bored
    ports:
      - "5432:5432"
    volumes:
      - bored_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bored"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bored_pg:
